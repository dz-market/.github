name: Go CI

on:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: false

            - uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.13

    test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: go.mod is tidy
              run: go mod tidy -diff

            - name: build
              run: go build ./...

            - name: test
              run: go test -race -count=1 ./...

    vulncheck:
        name: Vulncheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: golang/govulncheck-action@v1